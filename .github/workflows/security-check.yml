name: Security Check

on:
  pull_request:
  push:
    branches:
      - security-hardening-2026-10-01
      - main

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python syntax
        run: python -m compileall -q backend bot *.py
      - name: JavaScript syntax
        shell: bash
        run: |
          for file in frontend/static/js/*.js; do
            node --check "$file"
          done
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify async SQLAlchemy dependency
        run: python -c "import greenlet; print('greenlet OK')"
      - name: Import application
        run: python -c "import backend.main; print('backend import OK')"
