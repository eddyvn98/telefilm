name: Security Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  security-and-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Python syntax
        run: python -m compileall -q backend bot *.py tests

      - name: JavaScript syntax
        shell: bash
        run: |
          for file in frontend/static/js/*.js; do
            node --check "$file"
          done

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Verify dependency graph
        run: python -m pip check

      - name: Import application
        run: python -c "import backend.main; print('backend import OK')"

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Dependency audit
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r requirements.txt
